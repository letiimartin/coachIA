name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tipos y tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coachia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Instalar dependencias
        run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Migraciones con una única cabeza
        run: |
          heads=$(uv run alembic heads | grep -c "(head)")
          echo "Cabezas de Alembic: $heads"
          test "$heads" -eq 1
      - name: Contrato OpenAPI actualizado
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json está desactualizado. Ejecuta 'uv run python -m scripts.export_openapi' en apps/api y súbelo."
            exit 1
          }
      - name: Tests (incluye esquema y migraciones contra Postgres)
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coachia_test

  mobile:
    name: App móvil (tipos y build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Cliente de la API al día con el contrato
        run: |
          npm run gen:api
          git diff --exit-code -- src/api || {
            echo "::error::El cliente de la API está desactualizado. Ejecuta 'npm run gen:api' en apps/mobile y súbelo."
            exit 1
          }
      - name: Tipos
        run: npm run typecheck
      - name: Generar bundle web
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
